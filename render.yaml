# Render Blueprint configuration for Cedar Hearth Restaurant POS
services:
  # 1. Django Backend Web Service
  - type: web
    name: restaurant-backend
    runtime: python
    region: singapore
    buildCommand: ./build.sh
    startCommand: gunicorn tclock.wsgi:application
    rootDir: backend
    envVars:
      - key: RENDER
        value: "true"
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_6UPocWs9DjSY@ep-hidden-recipe-azlq7kgu-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.12

  # 2. React Frontend Static Site
  - type: web
    name: restaurant-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://restaurant-backend-49tg.onrender.com/api

